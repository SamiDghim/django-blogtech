<!DOCTYPE html>
<html lang="en">
  <head>
    {%load static%}
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon" />
    <!-- Old CSS for components not yet migrated -->
    <link rel="stylesheet" href="{% static 'styles/main.css'%}" />
    <!-- New Tailwind CSS -->
    <link rel="stylesheet" href="{% static 'css/main.css'%}" />
    <title>StudyBuddy - Find study partners around the world!</title>
    
    <!-- Turbo progress bar styling -->
    <style>
      .turbo-progress-bar {
        height: 3px;
        background: linear-gradient(to right, #71c6dd, #5dd693);
        border-radius: 0 2px 2px 0;
        box-shadow: 0 0 8px rgba(113, 198, 221, 0.4);
      }
    </style>
  </head>

  <body class="min-h-screen bg-bg text-light-gray leading-relaxed font-normal text-base">
    {% include 'navbar.html' %} 

    {% if messages %}
    <ul class="messages">
      {% for message in messages %}
      <li class="bg-error text-white p-4 rounded">{{ message }}</li>
      {% endfor %}
    </ul>
    {%endif%} 

    {% block content %} 
    
    {% endblock %}
    
    <!-- Turbo & Stimulus for SPA experience -->
    <script type="module" src="{% static 'dist/bundle.js'%}"></script>
    <script src="{% static 'js/script.js'%}"></script>
  </body>
</html>
